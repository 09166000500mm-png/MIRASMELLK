name: Build Mirasmellk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,web .
      - name: Prepare final source
        run: |
          cp lib/main_final.dart lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart')
          s=p.read_text()
          s=s.replace(']))));}}', '])))));}')
          s=s.replace('e.key=TextEditingController(text:e.value)', 'e.key:TextEditingController(text:e.value)')
          lines=s.splitlines()
          for i,line in enumerate(lines):
              if line.startswith('Widget stat(') and line.endswith('}'): lines[i]=line[:-1]
              if line.startswith('class _PropertyDialogState') and line.endswith('}}'): lines[i]=line[:-1]
              if line.startswith('class _SettingsDialogState') and line.endswith('}}'): lines[i]=line[:-1]
          p.write_text('\n'.join(lines)+'\n')
          PY
          rm -f lib/main_final.dart lib/main_clean.dart test/widget_test.dart
      - name: Configure Android share receiver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:exported="true"', 'android:exported="true" android:launchMode="singleTask"', 1)
          marker='</activity>'
          share='''\n            <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="text/plain" />\n            </intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="text/*" />\n            </intent-filter>\n          '''
          s=s.replace(marker, share+marker, 1)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos || true
      - name: Configure Java 17 for Android plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          s += '\n\nandroid {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n}\n\nkotlin {\n    jvmToolchain(17)\n}\n'
          p.write_text(s)
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mirasmellk-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web .
      - name: Prepare final source
        run: |
          cp lib/main_final.dart lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart')
          s=p.read_text()
          s=s.replace(']))));}}', '])))));}')
          s=s.replace('e.key=TextEditingController(text:e.value)', 'e.key:TextEditingController(text:e.value)')
          lines=s.splitlines()
          for i,line in enumerate(lines):
              if line.startswith('Widget stat(') and line.endswith('}'): lines[i]=line[:-1]
              if line.startswith('class _PropertyDialogState') and line.endswith('}}'): lines[i]=line[:-1]
              if line.startswith('class _SettingsDialogState') and line.endswith('}}'): lines[i]=line[:-1]
          p.write_text('\n'.join(lines)+'\n')
          PY
          rm -f lib/main_final.dart lib/main_clean.dart test/widget_test.dart
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: mirasmellk-web
          path: build/web

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios .
      - name: Prepare final source
        run: |
          cp lib/main_final.dart lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart')
          s=p.read_text()
          s=s.replace(']))));}}', '])))));}')
          s=s.replace('e.key=TextEditingController(text:e.value)', 'e.key:TextEditingController(text:e.value)')
          lines=s.splitlines()
          for i,line in enumerate(lines):
              if line.startswith('Widget stat(') and line.endswith('}'): lines[i]=line[:-1]
              if line.startswith('class _PropertyDialogState') and line.endswith('}}'): lines[i]=line[:-1]
              if line.startswith('class _SettingsDialogState') and line.endswith('}}'): lines[i]=line[:-1]
          p.write_text('\n'.join(lines)+'\n')
          PY
          rm -f lib/main_final.dart lib/main_clean.dart test/widget_test.dart
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: mirasmellk-ios-unsigned
          path: build/ios/iphoneos/Runner.app
