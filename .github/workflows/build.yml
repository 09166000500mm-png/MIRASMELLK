name: Build Mirasmellk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,web .
      - name: Patch Dart source for release build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart')
          s=p.read_text()
          s=s.replace(']))));\n}\n}\n\nclass Dashboard', '])))));\n}\n}\n\nclass Dashboard')
          s=s.replace('SettingsPage(onTheme:onTheme)', 'SettingsPage(onTheme:widget.onTheme)')
          p.write_text(s)
          Path('lib/main_clean.dart').unlink(missing_ok=True)
          PY
      - name: Configure Android share receiver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:exported="true"', 'android:exported="true" android:launchMode="singleTask"', 1)
          marker='</activity>'
          share='''\n            <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="text/plain" />\n            </intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="text/*" />\n            </intent-filter>\n          '''
          s=s.replace(marker, share+marker, 1)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Configure Java 17 for Android plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          s += '\n\nandroid {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n}\n\nkotlin {\n    jvmToolchain(17)\n}\n'
          p.write_text(s)
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mirasmellk-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web .
      - name: Patch Dart source for web build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart')
          s=p.read_text()
          s=s.replace(']))));\n}\n}\n\nclass Dashboard', '])))));\n}\n}\n\nclass Dashboard')
          s=s.replace('SettingsPage(onTheme:onTheme)', 'SettingsPage(onTheme:widget.onTheme)')
          p.write_text(s)
          Path('lib/main_clean.dart').unlink(missing_ok=True)
          PY
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: mirasmellk-web
          path: build/web

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios .
      - name: Patch Dart source for iOS build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart')
          s=p.read_text()
          s=s.replace(']))));\n}\n}\n\nclass Dashboard', '])))));\n}\n}\n\nclass Dashboard')
          s=s.replace('SettingsPage(onTheme:onTheme)', 'SettingsPage(onTheme:widget.onTheme)')
          p.write_text(s)
          Path('lib/main_clean.dart').unlink(missing_ok=True)
          PY
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: mirasmellk-ios-unsigned
          path: build/ios/iphoneos/Runner.app
