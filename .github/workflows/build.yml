name: Build Mirasmellk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,web .
      - name: Prepare source
        run: |
          cp lib/main_final.dart lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/main.dart')
          s=p.read_text()
          s=re.sub(r'children:fields\)\);?\}\}', 'children:fields)));}', s)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos || true
      - name: Configure Java 17 for Android plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          s += '\n\nandroid {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n}\n\nkotlin {\n    jvmToolchain(17)\n}\n'
          p.write_text(s)
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mirasmellk-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web .
      - name: Prepare source
        run: |
          cp lib/main_final.dart lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/main.dart')
          s=p.read_text()
          s=re.sub(r'children:fields\)\);?\}\}', 'children:fields)));}', s)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: mirasmellk-web
          path: build/web

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios .
      - name: Prepare source
        run: |
          cp lib/main_final.dart lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/main.dart')
          s=p.read_text()
          s=re.sub(r'children:fields\)\);?\}\}', 'children:fields)));}', s)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: mirasmellk-ios-unsigned
          path: build/ios/iphoneos/Runner.app
