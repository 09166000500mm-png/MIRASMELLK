name: Build Mirasmellk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,web .
      - name: Prepare source
        run: |
          cp lib/main_final.dart lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/main.dart')
          s=p.read_text()
          shell='''class _ShellState extends State<Shell>{
            int tab=0;
            @override Widget build(BuildContext c){
              final pages=<Widget>[Home(onTab:(i)=>setState(()=>tab=i)),const Files(),const Clients(),const Meetings(),const Commission()];
              return Directionality(textDirection:TextDirection.rtl,child:Scaffold(
                appBar:AppBar(backgroundColor:navy,foregroundColor:Colors.white,title:const Text('میراث ملک'),actions:[IconButton(onPressed:()=>showDialog(context:c,builder:(_)=>Settings(onDark:widget.onDark)),icon:const Icon(Icons.settings))]),
                body:pages[tab],
                bottomNavigationBar:NavigationBar(backgroundColor:navy,selectedIndex:tab,onDestinationSelected:(i)=>setState(()=>tab=i),destinations:const[
                  NavigationDestination(icon:Icon(Icons.dashboard,color:Colors.white),label:'خانه'),
                  NavigationDestination(icon:Icon(Icons.home_work,color:Colors.white),label:'فایل‌ها'),
                  NavigationDestination(icon:Icon(Icons.people,color:Colors.white),label:'مشتریان'),
                  NavigationDestination(icon:Icon(Icons.event,color:Colors.white),label:'جلسات'),
                  NavigationDestination(icon:Icon(Icons.calculate,color:Colors.white),label:'کمیسیون'),
                ]),
              ));
            }
          }
          '''
          s=re.sub(r'class _ShellState.*?class Home',shell+'class Home',s,flags=re.S)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos || true
      - name: Configure Java 17 for Android plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          s += '\n\nandroid {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n}\n\nkotlin {\n    jvmToolchain(17)\n}\n'
          p.write_text(s)
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mirasmellk-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web .
      - name: Prepare source
        run: |
          cp lib/main_final.dart lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/main.dart')
          s=p.read_text()
          shell='''class _ShellState extends State<Shell>{
            int tab=0;
            @override Widget build(BuildContext c){
              final pages=<Widget>[Home(onTab:(i)=>setState(()=>tab=i)),const Files(),const Clients(),const Meetings(),const Commission()];
              return Directionality(textDirection:TextDirection.rtl,child:Scaffold(
                appBar:AppBar(backgroundColor:navy,foregroundColor:Colors.white,title:const Text('میراث ملک'),actions:[IconButton(onPressed:()=>showDialog(context:c,builder:(_)=>Settings(onDark:widget.onDark)),icon:const Icon(Icons.settings))]),
                body:pages[tab],
                bottomNavigationBar:NavigationBar(backgroundColor:navy,selectedIndex:tab,onDestinationSelected:(i)=>setState(()=>tab=i),destinations:const[
                  NavigationDestination(icon:Icon(Icons.dashboard,color:Colors.white),label:'خانه'),
                  NavigationDestination(icon:Icon(Icons.home_work,color:Colors.white),label:'فایل‌ها'),
                  NavigationDestination(icon:Icon(Icons.people,color:Colors.white),label:'مشتریان'),
                  NavigationDestination(icon:Icon(Icons.event,color:Colors.white),label:'جلسات'),
                  NavigationDestination(icon:Icon(Icons.calculate,color:Colors.white),label:'کمیسیون'),
                ]),
              ));
            }
          }
          '''
          s=re.sub(r'class _ShellState.*?class Home',shell+'class Home',s,flags=re.S)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: mirasmellk-web
          path: build/web

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios .
      - name: Prepare source
        run: |
          cp lib/main_final.dart lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/main.dart')
          s=p.read_text()
          shell='''class _ShellState extends State<Shell>{
            int tab=0;
            @override Widget build(BuildContext c){
              final pages=<Widget>[Home(onTab:(i)=>setState(()=>tab=i)),const Files(),const Clients(),const Meetings(),const Commission()];
              return Directionality(textDirection:TextDirection.rtl,child:Scaffold(
                appBar:AppBar(backgroundColor:navy,foregroundColor:Colors.white,title:const Text('میراث ملک'),actions:[IconButton(onPressed:()=>showDialog(context:c,builder:(_)=>Settings(onDark:widget.onDark)),icon:const Icon(Icons.settings))]),
                body:pages[tab],
                bottomNavigationBar:NavigationBar(backgroundColor:navy,selectedIndex:tab,onDestinationSelected:(i)=>setState(()=>tab=i),destinations:const[
                  NavigationDestination(icon:Icon(Icons.dashboard,color:Colors.white),label:'خانه'),
                  NavigationDestination(icon:Icon(Icons.home_work,color:Colors.white),label:'فایل‌ها'),
                  NavigationDestination(icon:Icon(Icons.people,color:Colors.white),label:'مشتریان'),
                  NavigationDestination(icon:Icon(Icons.event,color:Colors.white),label:'جلسات'),
                  NavigationDestination(icon:Icon(Icons.calculate,color:Colors.white),label:'کمیسیون'),
                ]),
              ));
            }
          }
          '''
          s=re.sub(r'class _ShellState.*?class Home',shell+'class Home',s,flags=re.S)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: mirasmellk-ios-unsigned
          path: build/ios/iphoneos/Runner.app
