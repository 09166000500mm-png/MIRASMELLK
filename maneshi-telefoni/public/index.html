<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منشی تلفنی میراث ملک</title><style>body{font-family:Tahoma,Arial;background:#f3f4f6;margin:0}.wrap{max-width:700px;margin:30px auto;padding:18px}.card{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #0001}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font-size:16px}input{border:1px solid #ccc;margin:10px 0}button{border:0;background:#111827;color:#fff}.status{padding:12px;margin-top:12px;background:#f3f4f6;border-radius:10px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee}</style></head><body><div class="wrap"><div class="card"><h1>📞 منشی تلفنی میراث ملک</h1><p>تماس واقعی با مشتری و ثبت اطلاعات ملک</p><input id="phone" placeholder="+989121234567" type="tel"><button id="call">شروع تماس واقعی</button><div id="status" class="status">آماده تماس</div></div><div class="card"><h3>آخرین تماس‌ها</h3><button onclick="load()">به‌روزرسانی</button><div id="list"></div></div></div><script>const $=x=>document.getElementById(x);$("call").onclick=async()=>{let phone=$("phone").value.trim();if(!phone)return $("status").textContent="شماره مشتری را وارد کنید";$("call").disabled=true;$("status").textContent="در حال برقراری تماس...";try{let r=await fetch("/api/call",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone})}),d=await r.json();if(!r.ok)throw Error(d.error||"خطا");$("status").textContent="تماس ارسال شد؛ شناسه "+d.callId;load()}catch(e){$("status").textContent="خطا: "+e.message}finally{$("call").disabled=false}};async function load(){try{let r=await fetch("/api/calls"),a=await r.json();$("list").innerHTML=a.length?"<table><tr><th>شماره</th><th>وضعیت</th><th>زمان</th></tr>"+a.map(x=>"<tr><td>"+x.phone+"</td><td>"+x.status+"</td><td>"+x.started_at+"</td></tr>").join("")+"</table>":"هنوز تماسی ثبت نشده."}catch{}}load();</script></body></html>
